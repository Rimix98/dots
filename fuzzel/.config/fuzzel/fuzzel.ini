# fuzzel — monochrome
# palette "qs-mono": core #0a0a0d  muted #9a9ca2  dim #5b5d63  line #232529

[main]
font=JetBrains Mono:size=11
dpi-aware=yes
icons-enabled=yes
icon-theme=Tela-circle-black
prompt=""
placeholder="> "
exit-on-keyboard-focus-loss=no
terminal=kitty
layer=overlay
width=26
lines=12
horizontal-pad=16
vertical-pad=10
inner-pad=6

[border]
width=1
radius=6
outer-rad=1

[colors]
background=0a0a0aff
text=d0d0d0ff
match=9f78bdff
selection=111111ff
selection-text=ffffffff
border=9f78bdff

# dimmed base plate
background=0a0a0de0

# input
prompt=5b5d63ff
placeholder=5b5d63ff
text=e8e8eaff
match=ffffffff

# selection = inverted mono
selection=ffffffff
selection-text=0a0a0dff
selection-match=8a8c92ff
